[project]
name = "recallcoach"
version = "0.1.0"
description = "数据库系统复习教练：用 PowerContext 记住薄弱点并改变出题顺序"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
recallcoach = "recallcoach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recallcoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette 1.x 的 TestClient 更希望底层用 httpx2；我们仍用 httpx。
# 只屏蔽这一条已知的三方弃用提示，其它 warning 继续暴露。
filterwarnings = [
  "ignore:Using .httpx. with .starlette.testclient. is deprecated:UserWarning",
]
pythonpath = ["src"]
addopts = "-q"
