services:
  recallcoach:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # 需要接 PowerContext 时把这两项指过去；留空则以"记忆离线"模式运行
      POWERCONTEXT_BASE_URL: ${POWERCONTEXT_BASE_URL:-}
      POWERCONTEXT_TOKEN: ${POWERCONTEXT_TOKEN:-}
      RECALLCOACH_DB: /tmp/recallcoach/app.db
      RECALLCOACH_AUDIT: /tmp/recallcoach/memory_audit.jsonl
